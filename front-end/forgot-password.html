<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Vita Scan</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="container">
            <div class="logo">
                <h1>Vita Scan</h1>
            </div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html#home" class="nav-link">Home</a></li>
                    <li><a href="index.html#scan" class="nav-link">Scan</a></li>
                    <li><a href="index.html#login" class="nav-link">Login</a></li>
                    <li><a href="index.html#download" class="nav-link">Download Report</a></li>
                    <li><a href="index.html#about" class="nav-link">About</a></li>
                </ul>
            </nav>
            <div class="mobile-menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <!-- Forgot Password Section -->
    <section class="login-section">
        <div class="container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-icon">🔑</div>
                    <h2 class="section-title">Forgot Password</h2>
                    <p class="login-subtitle">Enter your email to receive a password reset link</p>
                </div>
                <form class="login-form" id="forgotPasswordForm" novalidate>
                    <div class="form-group">
                        <label for="email">
                            <span class="label-text">Email Address</span>
                            <span class="required-indicator">*</span>
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                placeholder="Enter your registered email" 
                                autocomplete="email"
                                required
                                aria-describedby="email-error"
                            >
                            <span class="input-icon">📧</span>
                        </div>
                        <span class="error-message" id="email-error" role="alert"></span>
                    </div>
                    <div class="form-message" id="formMessage" role="alert"></div>
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <span class="btn-text">Send Reset Link</span>
                        <span class="btn-loader" style="display: none;">
                            <span class="spinner"></span>
                            Sending...
                        </span>
                    </button>
                    <div class="back-to-login">
                        <a href="index.html#login" class="forgot-password">← Back to Login</a>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
    <script>
        // Forgot Password Form Handler
        document.addEventListener('DOMContentLoaded', function() {
            const forgotPasswordForm = document.getElementById('forgotPasswordForm');
            const emailInput = document.getElementById('email');
            const submitBtn = document.getElementById('submitBtn');
            const formMessage = document.getElementById('formMessage');

            // Email validation
            function validateEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            function validateField(field, value) {
                const errorElement = document.getElementById(field.id + '-error');
                let isValid = true;
                let errorMessage = '';

                field.classList.remove('error', 'success');
                if (errorElement) {
                    errorElement.textContent = '';
                    errorElement.classList.remove('show');
                }

                if (!value.trim()) {
                    isValid = false;
                    errorMessage = 'Email address is required';
                } else if (!validateEmail(value.trim())) {
                    isValid = false;
                    errorMessage = 'Please enter a valid email address';
                }

                if (!isValid && errorMessage) {
                    field.classList.add('error');
                    if (errorElement) {
                        errorElement.textContent = errorMessage;
                        errorElement.classList.add('show');
                    }
                } else if (value.trim()) {
                    field.classList.add('success');
                }

                return isValid;
            }

            // Real-time validation
            if (emailInput) {
                emailInput.addEventListener('blur', function() {
                    validateField(this, this.value);
                });
                emailInput.addEventListener('input', function() {
                    if (this.classList.contains('error')) {
                        validateField(this, this.value);
                    }
                });
            }

            // Form submission
            if (forgotPasswordForm) {
                forgotPasswordForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    hideFormMessage();
                    
                    const email = emailInput.value.trim();
                    const emailValid = validateField(emailInput, email);

                    if (!emailValid) {
                        showFormMessage('Please enter a valid email address.', 'error');
                        return;
                    }

                    setLoadingState(true);

                    try {
                        // Simulate backend email verification
                        await simulateEmailVerification(email);
                        showFormMessage('Password reset link has been sent to your email. Please check your inbox.', 'success');
                        forgotPasswordForm.reset();
                    } catch (error) {
                        showFormMessage('An error occurred. Please try again later.', 'error');
                    } finally {
                        setLoadingState(false);
                    }
                });
            }

            // Simulate backend email verification
            async function simulateEmailVerification(email) {
                await new Promise(resolve => setTimeout(resolve, 1500));
                // In a real app, this would call your backend API
                return { success: true };
            }

            function setLoadingState(isLoading) {
                if (submitBtn) {
                    submitBtn.disabled = isLoading;
                    const btnText = submitBtn.querySelector('.btn-text');
                    const btnLoader = submitBtn.querySelector('.btn-loader');
                    
                    if (isLoading) {
                        if (btnText) btnText.style.display = 'none';
                        if (btnLoader) btnLoader.style.display = 'flex';
                    } else {
                        if (btnText) btnText.style.display = 'inline-block';
                        if (btnLoader) btnLoader.style.display = 'none';
                    }
                }
            }

            function showFormMessage(message, type = 'info') {
                if (formMessage) {
                    formMessage.textContent = message;
                    formMessage.className = `form-message ${type} show`;
                    formMessage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }

            function hideFormMessage() {
                if (formMessage) {
                    formMessage.classList.remove('show');
                    formMessage.textContent = '';
                }
            }

            // Mobile menu toggle (reuse from main script)
            const mobileMenuToggle = document.querySelector('.mobile-menu-toggle');
            const navMenu = document.querySelector('.nav-menu');

            if (mobileMenuToggle) {
                mobileMenuToggle.addEventListener('click', function() {
                    navMenu.classList.toggle('active');
                    mobileMenuToggle.classList.toggle('active');
                });
            }
        });
    </script>
</body>
</html>
