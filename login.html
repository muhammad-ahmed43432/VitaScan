{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="card auth-card">
        <h2>Log In</h2>
        <form method="post" action="{{ url_for('login') }}">
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required value="{{ request.form.get('email', '') }}">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <a href="{{ url_for('forgot_password') }}" style="font-size: 0.9rem;">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Log In</button>
        </form>
        <p class="auth-footer">Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></p>
    </div>
</div>
{% endblock %}
