{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="card auth-card">
        <h2>Set New Password</h2>
        <form method="post" action="{{ url_for('reset_password', token=token) }}">
            <div class="form-group">
                <label class="form-label" for="password">New Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required minlength="8">
                <p class="form-hint">At least 8 chars, 1 uppercase, 1 lowercase, 1 digit, 1 special character</p>
            </div>
            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="••••••••" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Reset Password</button>
        </form>
    </div>
</div>
{% endblock %}
